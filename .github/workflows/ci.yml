name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10 Build & Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore tests/EgitimPlatform.Unit/EgitimPlatform.Unit.csproj

      - name: Build API, Modules & Unit Tests (Release)
        run: dotnet build tests/EgitimPlatform.Unit/EgitimPlatform.Unit.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/EgitimPlatform.Unit/EgitimPlatform.Unit.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (TypeScript, Build & Env Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "src/Web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production bundle build
        env:
          VITE_API_BASE_URL: "/"
        run: npx vite build

      - name: Run frontend environment & auth unit tests
        run: npx playwright test e2e/auth-unit.spec.ts e2e/prod-env.spec.ts

  docker:
    name: Docker & Production Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration & operational scripts
        env:
          MSSQL_SA_PASSWORD: "CI_Placeholder_Password_Not_A_Secret_123!"
          JWT_SIGNING_KEY: "CI_Placeholder_Signing_Key_Min_32_Characters_Long!"
          CORS_ALLOWED_ORIGIN: "https://localhost"
        run: |
          docker compose -f docker-compose.prod.yml config -q
          bash -n scripts/mssql-backup.sh scripts/mssql-restore-verify.sh scripts/demo-up.sh scripts/demo-down.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production API image (Dockerfile.api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: egitim-platform-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build production Web image (Dockerfile.web)
        uses: docker/build-push-action@v6
        with:
          context: src/Web
          file: Dockerfile.web
          push: false
          load: true
          tags: egitim-platform-web:ci
          build-args: |
            VITE_API_BASE_URL=/
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
